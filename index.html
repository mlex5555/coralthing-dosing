<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Thing - Dosing Calculator</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --highlight-green: #39ff14;
            --highlight-blue: #00e5ff;
            --highlight-purple: #bf00ff;
            --text-gray: #b0b0b0;
            --input-bg: #222222;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            min-height: 100px; /* จองพื้นที่ไว้กันหน้าเว็บกระตุกตอนรูปโหลด */
        }
        .logo-container img {
            max-width: 250px; 
            height: auto;
            filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.2));
        }
        .main-header {
            color: var(--highlight-green);
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            opacity: 0.9;
        }
        .section-title {
            font-size: 1.1rem;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 4px solid;
            text-align: left;
            font-weight: bold;
        }
        .kh-title { border-color: var(--highlight-green); color: var(--highlight-green); }
        .ca-title { border-color: var(--highlight-blue); color: var(--highlight-blue); }
        .mg-title { border-color: var(--highlight-purple); color: var(--highlight-purple); }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #555;
        }
        button {
            width: 100%;
            padding: 20px;
            background-color: var(--highlight-green);
            border: none;
            color: #000;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 10px 20px rgba(57, 255, 20, 0.2);
            transition: all 0.2s;
        }
        button:active { transform: scale(0.97); }
        
        .result-box {
            margin-top: 15px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 18px;
            text-align: center;
        }
        .kh-res { border-bottom: 3px solid var(--highlight-green); }
        .ca-res { border-bottom: 3px solid var(--highlight-blue); }
        .mg-res { border-bottom: 3px solid var(--highlight-purple); }

        .result-label { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 5px; }
        .result-value { font-size: 2.2rem; font-weight: bold; }
        .kh-val { color: var(--highlight-green); }
        .ca-val { color: var(--highlight-blue); }
        .mg-val { color: var(--highlight-purple); }

        .split-info {
            font-size: 0.95rem;
            color: #ffffff;
            background: #262626;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .footer-note {
            font-size: 0.7rem;
            color: #444;
            text-align: center;
            margin-top: 40px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://drive.google.com/thumbnail?id=1_g6kFzfSdajUYqvW_4iJuRZ_mCpl0-BS&sz=w1000" alt="Coral Thing Logo">
    </div>

    <div class="main-header">Dosing Calculator</div>
    
    <div class="input-group">
        <label>ปริมาตรน้ำรวมในระบบ (ลิตร)</label>
        <input type="number" id="volume" value="261">
    </div>

    <div class="section-title kh-title">Alkalinity (KH)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม KH (dKH)</label>
        <input type="number" id="kh_target" value="0.5" step="0.01">
    </div>
    <div class="result-box kh-res">
        <div class="result-label">ปริมาณโดส KH</div>
        <div class="result-value kh-val" id="kh_result">0.0 ml</div>
        <div id="kh_split" class="split-info">---</div>
    </div>

    <div class="section-title ca-title">Calcium (Ca)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม Calcium (ppm)</label>
        <input type="number" id="ca_target" value="10" step="1">
    </div>
    <div class="result-box ca-res">
        <div class="result-label">ปริมาณโดส Calcium</div>
        <div class="result-value ca-val" id="ca_result">0.0 ml</div>
        <div id="ca_split" class="split-info">---</div>
    </div>

    <div class="section-title mg-title">Magnesium (Mg)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม Magnesium (ppm)</label>
        <input type="number" id="mg_target" value="10" step="1">
    </div>
    <div class="result-box mg-res">
        <div class="result-label">ปริมาณโดส Magnesium</div>
        <div class="result-value mg-val" id="mg_result">0.0 ml</div>
        <div id="mg_split" class="split-info">---</div>
    </div>

    <button onclick="calculateAll()">คำนวณทันที</button>

    <div class="footer-note">
        CORAL THING - PROFESSIONAL REEF CARE<br>
        *คำนวณตามความเข้มข้นลับเฉพาะของแบรนด์ Coral Thing
    </div>
</div>

<script>
// สูตรลับ (ซ่อนจากหน้าจอ)
const SECRET_FORMULA = {
    kh: 60,
    ca: 166.6,
    mg: 185
};

function calculateAll() {
    const vol = parseFloat(document.getElementById('volume').value);
    
    // KH Calculation
    const khT = parseFloat(document.getElementById('kh_target').value);
    if (vol > 0 && khT > 0) {
        const khGrams = khT * vol * 0.03022;
        const khMl = (khGrams / SECRET_FORMULA.kh) * 1000;
        document.getElementById('kh_result').innerText = khMl.toFixed(1) + " ml";
        document.getElementById('kh_split').innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (khMl/12).toFixed(1) + " ml</b>";
    }

    // Calcium Calculation
    const caT = parseFloat(document.getElementById('ca_target').value);
    if (vol > 0 && caT > 0) {
        const caGrams = caT * vol * 0.00366; 
        const caMl = (caGrams / SECRET_FORMULA.ca) * 1000;
        document.getElementById('ca_result').innerText = caMl.toFixed(1) + " ml";
        document.getElementById('ca_split').innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (caMl/12).toFixed(1) + " ml</b>";
    }

    // Magnesium Calculation
    const mgT = parseFloat(document.getElementById('mg_target').value);
    if (vol > 0 && mgT > 0) {
        const mgGrams = mgT * vol * 0.0084;
        const mgMl = (mgGrams / SECRET_FORMULA.mg) * 1000;
        document.getElementById('mg_result').innerText = mgMl.toFixed(1) + " ml";
        document.getElementById('mg_split').innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (mgMl/12).toFixed(1) + " ml</b>";
    }
}

window.onload = calculateAll;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Thing - Dosing Calculator</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --highlight-green: #39ff14;
            --highlight-blue: #00e5ff;
            --highlight-purple: #bf00ff;
            --shopee-orange: #ee4d2d;
            --text-gray: #b0b0b0;
            --input-bg: #222222;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            min-height: 100px;
        }
        .logo-container img {
            max-width: 280px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.25));
        }
        .visitor-counter {
            background: #000;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            border: 1px solid #333;
        }
        .main-header {
            color: var(--highlight-green);
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            opacity: 0.9;
        }
        .section-title {
            font-size: 1.1rem;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 4px solid;
            text-align: left;
            font-weight: bold;
        }
        .kh-title { border-color: var(--highlight-green); color: var(--highlight-green); }
        .ca-title { border-color: var(--highlight-blue); color: var(--highlight-blue); }
        .mg-title { border-color: var(--highlight-purple); color: var(--highlight-purple); }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #555; }

        .btn-calc {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            color: #000;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .btn-kh { background-color: var(--highlight-green); box-shadow: 0 4px 15px rgba(57, 255, 20, 0.2); }
        .btn-ca { background-color: var(--highlight-blue); box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2); }
        .btn-mg { background-color: var(--highlight-purple); box-shadow: 0 4px 15px rgba(191, 0, 255, 0.2); }
        
        .btn-calc:active { transform: scale(0.97); opacity: 0.8; }
        
        .result-box {
            margin-top: 12px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 18px;
            text-align: center;
        }
        .kh-res { border-bottom: 3px solid var(--highlight-green); }
        .ca-res { border-bottom: 3px solid var(--highlight-blue); }
        .mg-res { border-bottom: 3px solid var(--highlight-purple); }

        .result-label { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 5px; }
        .result-value { font-size: 2.2rem; font-weight: bold; }
        .kh-val { color: var(--highlight-green); }
        .ca-val { color: var(--highlight-blue); }
        .mg-val { color: var(--highlight-purple); }

        .split-info {
            font-size: 0.95rem;
            color: #ffffff;
            background: #262626;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* ปุ่ม Shopee */
        .shopee-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--shopee-orange);
            color: white;
            text-decoration: none;
            margin-top: 30px;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(238, 77, 45, 0.3);
            transition: transform 0.2s;
        }
        .shopee-link:active { transform: scale(0.95); }
        .shopee-link svg { margin-right: 10px; }

        .footer-note {
            font-size: 0.85rem !important;
            /* ใช้รหัสสีเขียว Neon ตรงๆ เพื่อไม่ให้มันไปดึงค่าอื่น */
            color: #39ff14 !important; 
            text-align: center;
            margin-top: 25px;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.8);
            font-weight: bold !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://drive.google.com/thumbnail?id=14ba5sILQjLWEWsSlzkSRE_ULlKT85Sbu&sz=w1000" alt="Coral Thing Logo">
    </div>

    <div class="visitor-counter">
        VISITORS: <script type="text/javascript" src="https://freevisitorcounts.com/en/home/counter/1283626/t/5"></script>
    </div>

    <div class="main-header">Dosing Calculator</div>
    
    <div class="input-group">
        <label>ปริมาณน้ำรวมในระบบ (ลิตร)</label>
        <input type="number" id="volume" placeholder="กรอกปริมาณน้ำ">
    </div>

    <div class="section-title kh-title">Alkalinity (KH)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม KH (dKH)</label>
        <input type="number" id="kh_target" placeholder="0" step="0.01">
        <button class="btn-calc btn-kh" onclick="calcKH()">คำนวณ KH</button>
    </div>
    <div class="result-box kh-res">
        <div class="result-label">ปริมาณโดส KH</div>
        <div class="result-value kh-val" id="kh_result">0.0 ml</div>
        <div id="kh_split" class="split-info">---</div>
    </div>

    <div class="section-title ca-title">Calcium (Ca)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม Calcium (ppm)</label>
        <input type="number" id="ca_target" placeholder="0" step="1">
        <button class="btn-calc btn-ca" onclick="calcCA()">คำนวณ Calcium</button>
    </div>
    <div class="result-box ca-res">
        <div class="result-label">ปริมาณโดส Calcium</div>
        <div class="result-value ca-val" id="ca_result">0.0 ml</div>
        <div id="ca_split" class="split-info">---</div>
    </div>

    <div class="section-title mg-title">Magnesium (Mg)</div>
    <div class="input-group">
        <label>ต้องการเพิ่ม Magnesium (ppm)</label>
        <input type="number" id="mg_target" placeholder="0" step="1">
        <button class="btn-calc btn-mg" onclick="calcMG()">คำนวณ Magnesium</button>
    </div>
    <div class="result-box mg-res">
        <div class="result-label">ปริมาณโดส Magnesium</div>
        <div class="result-value mg-val" id="mg_result">0.0 ml</div>
        <div id="mg_split" class="split-info">---</div>
    </div>

    <a href="https://th.shp.ee/rm8QueSX" target="_blank" class="shopee-link">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19 17h2c.6 0 1-.4 1-1v-2c0-.6-.4-1-1-1h-2v4zm-7-7c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10-4h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM9 4h6v2H9V4zm12 16H3V8h18v12z"/></svg>
        ไปที่ร้าน Shopee
    </a>

   <div class="footer-note">
        <b>CORAL THING - ง่ายกว่า ประหยัดกว่า</b><br>
        <b>ห้ามเพิ่มค่าน้ำเกิน KH 1dkh, CA 20mg, MG 50mg ต่อวัน</b><br>   
    </div>
</div>

<script>
const CONCENTRATION = {
    kh: 166.67, 
    ca: 166.6, 
    mg: 185    
};

function getVol() { return parseFloat(document.getElementById('volume').value) || 0; }

function calcKH() {
    const vol = getVol();
    const khT = parseFloat(document.getElementById('kh_target').value) || 0;
    const resEl = document.getElementById('kh_result');
    const splitEl = document.getElementById('kh_split');
    
    if (vol > 0 && khT > 0) {
        const mlResult = ((khT * vol * 0.03022) / CONCENTRATION.kh) * 1000;
        resEl.innerText = mlResult.toFixed(1) + " ml";
        splitEl.innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (mlResult/12).toFixed(1) + " ml</b>";
    } else {
        resEl.innerText = "0.0 ml";
        splitEl.innerText = "---";
    }
}

function calcCA() {
    const vol = getVol();
    const caT = parseFloat(document.getElementById('ca_target').value) || 0;
    const resEl = document.getElementById('ca_result');
    const splitEl = document.getElementById('ca_split');

    if (vol > 0 && caT > 0) {
        const mlResult = ((caT * vol * 0.00366) / CONCENTRATION.ca) * 1000;
        resEl.innerText = mlResult.toFixed(1) + " ml";
        splitEl.innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (mlResult/12).toFixed(1) + " ml</b>";
    } else {
        resEl.innerText = "0.0 ml";
        splitEl.innerText = "---";
    }
}

function calcMG() {
    const vol = getVol();
    const mgT = parseFloat(document.getElementById('mg_target').value) || 0;
    const resEl = document.getElementById('mg_result');
    const splitEl = document.getElementById('mg_split');

    if (vol > 0 && mgT > 0) {
        const mlResult = ((mgT * vol * 0.0084) / CONCENTRATION.mg) * 1000;
        resEl.innerText = mlResult.toFixed(1) + " ml";
        splitEl.innerHTML = "แบ่งโดส 12 รอบ: <b>รอบละ " + (mlResult/12).toFixed(1) + " ml</b>";
    } else {
        resEl.innerText = "0.0 ml";
        splitEl.innerText = "---";
    }
}
</script>

</body>
</html>
